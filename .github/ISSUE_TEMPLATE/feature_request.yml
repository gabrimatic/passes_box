name: Feature request
description: Suggest a new feature for PassesBox
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed change
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches
      description: Any other approach you considered.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) would this affect?
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Web
        - All
    validations:
      required: true
